name: HACS Validation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  validate:
    name: HACS ${{ matrix.category }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category: [plugin, integration]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: ${{ matrix.category }}
